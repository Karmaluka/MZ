<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ------------------------------------------------------------------ */
/*  Іконки (прості SVG, без зовнішніх бібліотек)                       */
/* ------------------------------------------------------------------ */
function Icon({ path, size = 16, ...props }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
         strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      {path}
    </svg>
  );
}
const PlusIcon = (p) => <Icon {...p} path={<><path d="M12 5v14M5 12h14"/></>} />;
const TrashIcon = (p) => <Icon {...p} path={<><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></>} />;
const PencilIcon = (p) => <Icon {...p} path={<><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></>} />;
const XIcon = (p) => <Icon {...p} path={<><path d="M18 6 6 18M6 6l12 12"/></>} />;
const CheckIcon = (p) => <Icon {...p} path={<><path d="M20 6 9 17l-5-5"/></>} />;
const PiggyIcon = (p) => <Icon {...p} path={<><path d="M19 9V7a2 2 0 0 0-2-2h-1.5a5.5 5.5 0 0 0-9.8 3H4a1 1 0 0 0-1 1v3l2 1v2a1 1 0 0 0 1 1h1v2h3v-2h4v2h3v-2.3c1.2-.7 2-2 2-3.5V9Z"/><circle cx="15" cy="10" r="0.5" fill="currentColor"/></>} />;
const ChevronIcon = (p) => <Icon {...p} path={<><path d="m6 9 6 6 6-6"/></>} />;
const WarnIcon = (p) => <Icon {...p} path={<><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></>} />;
const DownloadIcon = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></>} />;
const UploadIcon = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></>} />;
const SaveIcon = (p) => <Icon {...p} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></>} />;
const SyncIcon = (p) => <Icon {...p} path={<><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M3 16v4h4"/><path d="M21 8V4h-4"/></>} />;

/* ------------------------------------------------------------------ */
/*  Початкові дані — реєстр приходу. Грн — еквівалент за курсом купівлі */
/* ------------------------------------------------------------------ */
const SEED = [];

const fmt = (n) =>
  n === null || n === undefined || isNaN(n)
    ? "—"
    : new Intl.NumberFormat("uk-UA", { maximumFractionDigits: 2 }).format(n);

const fmt2 = (n) =>
  n === null || n === undefined || isNaN(n)
    ? "—"
    : new Intl.NumberFormat("uk-UA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

const fmtDate = (d) => {
  if (!d) return "—";
  const [y, m, day] = d.split("-");
  return `${day}.${m}.${y}`;
};

const fmtDateTime = (d) => {
  if (!d) return "—";
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
};

function todayISO() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function uahEquivalent(e) {
  if (e.uah !== null && e.uah !== undefined) return e.uah;
  const amt = (e.usd || 0) + (e.eur || 0);
  if (amt && e.rate) return Math.round(amt * e.rate * 100) / 100;
  return null;
}

const STORAGE_KEY = "oshchadna-knyzhka-entries";
const HERE_KEY = "oshchadna-knyzhka-here";
const IDB_NAME = "oshchadna-knyzhka-db";
const IDB_STORE = "handles";
const IDB_KEY = "excel-file-handle";

// мінімальний IndexedDB-хелпер — тримає дескриптор файлу між сесіями,
// щоб не питати користувача обирати файл щоразу
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDel(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ------------------------------------------------------------------ */
/*  Простий SVG-графік лінії накопичення (без зовнішніх бібліотек)     */
/* ------------------------------------------------------------------ */
function MiniLineChart({ data }) {
  const width = 640, height = 200, padL = 50, padR = 12, padT = 12, padB = 24;
  const svgRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);

  if (data.length < 2) {
    return <div style={{ padding: "40px 12px", textAlign: "center", color: "#8a8267", fontSize: 13 }}>Замало даних для графіка.</div>;
  }
  const values = data.map((d) => d.value);
  const min = Math.min(0, ...values);
  const max = Math.max(...values);
  const xStep = (width - padL - padR) / (data.length - 1);
  const yScale = (v) => height - padB - ((v - min) / (max - min || 1)) * (height - padT - padB);
  const points = data.map((d, i) => [padL + i * xStep, yScale(d.value)]);
  const pathD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const zeroY = yScale(0);
  const ticksY = 4;
  const yTickVals = Array.from({ length: ticksY + 1 }, (_, i) => min + ((max - min) * i) / ticksY);
  const xTickIdx = [0, Math.floor(data.length / 2), data.length - 1];

  const activeIdx = hoverIdx !== null ? hoverIdx : data.length - 1;

  function updateFromClientX(clientX) {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const relX = ((clientX - rect.left) / rect.width) * width;
    let idx = Math.round((relX - padL) / xStep);
    idx = Math.max(0, Math.min(data.length - 1, idx));
    setHoverIdx(idx);
  }

  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 4 }}>
        <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: "#1F4B3F" }}>
          {fmt(data[activeIdx].value)}
        </div>
      </div>
      <svg
        ref={svgRef}
        viewBox={`0 0 ${width} ${height}`}
        style={{ width: "100%", height: "auto", display: "block", touchAction: "none", cursor: "crosshair" }}
        onPointerMove={(ev) => { ev.preventDefault(); updateFromClientX(ev.clientX); }}
        onPointerDown={(ev) => { ev.preventDefault(); updateFromClientX(ev.clientX); }}
        onPointerLeave={() => setHoverIdx(null)}
      >
        {yTickVals.map((v, i) => (
          <g key={i}>
            <line x1={padL} x2={width - padR} y1={yScale(v)} y2={yScale(v)} stroke="#ddd6bd" strokeDasharray="3 3" />
            <text x={padL - 6} y={yScale(v) + 3} textAnchor="end" fontSize="9" fontFamily="'IBM Plex Mono', monospace" fill="#5a5237">
              {fmt(Math.round(v))}
            </text>
          </g>
        ))}
        {xTickIdx.map((idx) => (
          <text key={idx} x={padL + idx * xStep} y={height - 6} textAnchor="middle" fontSize="9" fontFamily="'IBM Plex Mono', monospace" fill="#5a5237">
            {fmtDate(data[idx].date)}
          </text>
        ))}
        <line x1={padL} x2={width - padR} y1={zeroY} y2={zeroY} stroke="#b5474d" strokeDasharray="4 4" />
        <path d={pathD} fill="none" stroke="#1F4B3F" strokeWidth="2" />
        {points.map((p, i) => (
          <circle key={i} cx={p[0]} cy={p[1]} r="2.5" fill="#1F4B3F" opacity={i === activeIdx ? 0 : 0.5} />
        ))}
        <line x1={points[activeIdx][0]} x2={points[activeIdx][0]} y1={padT} y2={height - padB} stroke="#1F4B3F" strokeWidth="1" strokeDasharray="3 3" opacity="0.6" />
        <circle cx={points[activeIdx][0]} cy={points[activeIdx][1]} r="5" fill="#1F4B3F" stroke="#fbf9f2" strokeWidth="2" />
      </svg>
      <div style={{ textAlign: "center", marginTop: 4 }}>
        <div className="mono" style={{ fontSize: 12, color: "#5a5237" }}>
          {fmtDate(data[activeIdx].date)}
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */

function App() {
  const [entries, setEntries] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (e) {}
    return SEED;
  });

  // ---- "ТУТ" — сума $/€, яку користувач веде вручну (готівка при собі) ----
  const [hereUsd, setHereUsd] = useState(() => {
    try {
      const raw = localStorage.getItem(HERE_KEY);
      if (raw) return JSON.parse(raw).usd || 0;
    } catch (e) {}
    return 0;
  });
  const [hereEur, setHereEur] = useState(() => {
    try {
      const raw = localStorage.getItem(HERE_KEY);
      if (raw) return JSON.parse(raw).eur || 0;
    } catch (e) {}
    return 0;
  });
  useEffect(() => {
    try {
      localStorage.setItem(HERE_KEY, JSON.stringify({ usd: hereUsd, eur: hereEur }));
    } catch (e) {}
  }, [hereUsd, hereEur]);

  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [importMsg, setImportMsg] = useState(null);
  const xlsxInputRef = useRef(null);

  // ---- автозбереження в Excel-файл на диску (File System Access API) ----
  const fsaSupported = typeof window !== "undefined" && "showSaveFilePicker" in window;
  const [fileHandle, setFileHandle] = useState(null);      // активний, з дозволом на запис
  const [pendingHandle, setPendingHandle] = useState(null); // знайдений у IndexedDB, але дозвіл не підтверджено
  const [autoSaveState, setAutoSaveState] = useState("idle"); // idle | saving | saved | error
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const autoSaveTimer = useRef(null);
  const skipNextAutoSave = useRef(true); // не зберігати одразу при першому завантаженні даних

  // при старті — перевіряємо, чи є збережений раніше дескриптор файлу
  useEffect(() => {
    (async () => {
      try {
        if (!fsaSupported) return;
        const handle = await idbGet(IDB_KEY);
        if (!handle) return;
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm === "granted") {
          setFileHandle(handle);
        } else {
          setPendingHandle(handle);
        }
      } catch (e) {
        // немає збереженого дескриптора — нічого не робимо
      }
    })();
  }, []);

  async function writeToHandle(handle) {
    const wb = buildWorkbook(entries);
    const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const writable = await handle.createWritable();
    await writable.write(buf);
    await writable.close();
  }

  async function forceSaveNow() {
    if (!fileHandle) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    setAutoSaveState("saving");
    try {
      await writeToHandle(fileHandle);
      setAutoSaveState("saved");
      setLastSavedAt(new Date());
    } catch (e) {
      setAutoSaveState("error");
    }
  }

  async function connectExcelFile() {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "oshchadna-knyzhka.xlsx",
        types: [{
          description: "Excel Workbook",
          accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] },
        }],
      });
      await idbSet(IDB_KEY, handle);
      setFileHandle(handle);
      setPendingHandle(null);
      setAutoSaveState("saving");
      await writeToHandle(handle);
      setAutoSaveState("saved");
      setLastSavedAt(new Date());
    } catch (e) {
      if (e.name !== "AbortError") setAutoSaveState("error");
    }
  }

  async function reconnectExcelFile() {
    if (!pendingHandle) return;
    try {
      const perm = await pendingHandle.requestPermission({ mode: "readwrite" });
      if (perm === "granted") {
        setFileHandle(pendingHandle);
        setPendingHandle(null);
        setAutoSaveState("saving");
        await writeToHandle(pendingHandle);
        setAutoSaveState("saved");
        setLastSavedAt(new Date());
      }
    } catch (e) {
      setAutoSaveState("error");
    }
  }

  async function disconnectExcelFile() {
    await idbDel(IDB_KEY);
    setFileHandle(null);
    setPendingHandle(null);
    setAutoSaveState("idle");
    setLastSavedAt(null);
  }

  // автозбереження при кожній зміні записів (з невеликою затримкою)
  useEffect(() => {
    if (skipNextAutoSave.current) { skipNextAutoSave.current = false; return; }
    if (!fileHandle) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    setAutoSaveState("saving");
    autoSaveTimer.current = setTimeout(async () => {
      try {
        await writeToHandle(fileHandle);
        setAutoSaveState("saved");
        setLastSavedAt(new Date());
      } catch (e) {
        setAutoSaveState("error");
      }
    }, 600);
    return () => clearTimeout(autoSaveTimer.current);
  }, [entries, fileHandle]);

  // додаткова підстраховка: коли застосунок згортається/ховається (Android може будь-коли
  // "вбити" фонову вкладку) — примусово зберігаємо одразу, не чекаючи дебаунс
  useEffect(() => {
    function handleHide() {
      if (document.visibilityState === "hidden" && fileHandle) {
        writeToHandle(fileHandle).then(() => setLastSavedAt(new Date())).catch(() => {});
      }
    }
    document.addEventListener("visibilitychange", handleHide);
    window.addEventListener("pagehide", handleHide);
    return () => {
      document.removeEventListener("visibilitychange", handleHide);
      window.removeEventListener("pagehide", handleHide);
    };
  }, [fileHandle, entries]);

  // коли застосунок знову стає видимим (повернулись з фону) — перевіряємо дозвіл ще раз.
  // Android/Chrome інколи "забуває" дозвіл на запис після перезапуску процесу застосунку.
  useEffect(() => {
    async function recheck() {
      if (document.visibilityState !== "visible" || !fsaSupported) return;
      const handle = fileHandle || pendingHandle;
      if (!handle) return;
      try {
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm === "granted" && !fileHandle) {
          setFileHandle(handle);
          setPendingHandle(null);
        } else if (perm !== "granted" && fileHandle) {
          setPendingHandle(fileHandle);
          setFileHandle(null);
        }
      } catch (e) {}
    }
    document.addEventListener("visibilitychange", recheck);
    return () => document.removeEventListener("visibilitychange", recheck);
  }, [fileHandle, pendingHandle, fsaSupported]);

  // періодичний резервний запис — на випадок, якщо якась зміна з якоїсь причини
  // не спрацювала через звичайний автозапис по кожній зміні
  useEffect(() => {
    if (!fileHandle) return;
    const id = setInterval(() => {
      writeToHandle(fileHandle).then(() => setLastSavedAt(new Date())).catch(() => {});
    }, 20000);
    return () => clearInterval(id);
  }, [fileHandle, entries]);

  function buildWorkbook(entriesToExport) {
    // сортуємо як у оригіналі — за датою (без дати — в кінець)
    const sorted = [...entriesToExport].sort((a, b) => {
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date.localeCompare(b.date);
    });

    const firstDataRow = 6;   // дані з 6-го рядка, як в оригіналі
    const lastDataRow = firstDataRow + sorted.length - 1;

    // числові формати — скопійовані з оригінального файлу
    const FMT_USD = `_([$$-409]* #,##0_);_([$$-409]* \\(#,##0\\);_([$$-409]* \\-_);_(@_)`;
    const FMT_EUR = `[$€-2]\\ #,##0;[Red][$€-2]\\ #,##0`;
    const FMT_UAH = `_-* #,##0\\ [$₴-422]_-;\\-* #,##0\\ [$₴-422]_-;_-* \\-??\\ [$₴-422]_-;_-@_-`;
    const FMT_DATE = "dd.mm.yyyy";

    // кольори — витягнуті з теми оригінального файлу ("To Do List")
    const COL_BLUE = "31A0C5";   // accent4 — заголовок, блакитні плашки
    const COL_PURPLE = "8982A2"; // приглушений відтінок dk2 — плашки підсумків
    const COL_NAVY = "140545";   // dk2 — колір тексту заголовків таблиці
    const COL_GRAY = "7F7F7F";   // приглушений чорний — номери рядків

    const aoa = [];
    aoa[0] = ["Мої заощадження "];
    aoa[1] = [];
    aoa[2] = [];
    aoa[3] = [];
    aoa[4] = [null, "Дата", "Опис", "Дохід $", "€", "курс", "грн."];

    sorted.forEach((e, i) => {
      const dateVal = e.date ? new Date(e.date + "T00:00:00") : null;
      aoa[firstDataRow - 1 + i] = [i + 1, dateVal, e.desc, e.usd, e.eur, e.rate, e.uah];
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);

    // ---- підсумкові формули в рядку 3 ----
    ws["B3"] = { t: "n", f: `SUM(D${firstDataRow}:D${lastDataRow})`, z: FMT_USD };
    ws["E3"] = { t: "n", f: `SUM(E${firstDataRow}:E${lastDataRow})`, z: FMT_EUR };
    ws["G3"] = { t: "n", f: `SUM(G${firstDataRow}:G${lastDataRow})`, z: FMT_UAH };
    ws["I2"] = { t: "s", v: "Сума при умові $=€" };
    ws["I3"] = { t: "n", f: "B3+E3", z: FMT_USD };

    // розширюємо діапазон аркуша, щоб врахувати клітинки I2/I3
    const range = XLSX.utils.decode_range(ws["!ref"]);
    range.e.c = Math.max(range.e.c, XLSX.utils.decode_col("I"));
    ws["!ref"] = XLSX.utils.encode_range(range);

    // ---- стилі ----
    const sTitle = { font: { name: "Calibri", sz: 28, bold: true, color: { rgb: COL_BLUE } }, alignment: { horizontal: "center", vertical: "center" } };
    const sSummaryBase = { fill: { patternType: "solid", fgColor: { rgb: COL_PURPLE } }, font: { name: "Calibri", color: { rgb: "FFFFFF" } }, alignment: { horizontal: "center", vertical: "center" } };
    const sBadgeBase = { fill: { patternType: "solid", fgColor: { rgb: COL_BLUE } }, font: { name: "Calibri", bold: true, color: { rgb: "FFFFFF" } }, alignment: { horizontal: "center", vertical: "center" } };
    const thinBottom = { bottom: { style: "thin", color: { rgb: "140545" } } };

    ws["A1"].s = sTitle;
    ws["B3"].s = { ...sSummaryBase, font: { ...sSummaryBase.font, sz: 20, bold: true } };
    ws["E3"].s = { ...sSummaryBase, font: { ...sSummaryBase.font, sz: 16 } };
    ws["G3"].s = { ...sSummaryBase, font: { ...sSummaryBase.font, sz: 18 } };
    ws["I2"].s = { ...sBadgeBase, font: { ...sBadgeBase.font, sz: 14 } };
    ws["I3"].s = { ...sBadgeBase, font: { ...sBadgeBase.font, sz: 24 } };

    // заголовки таблиці (рядок 5)
    ws["B5"].s = { font: { name: "Calibri", sz: 16, bold: true, color: { rgb: COL_NAVY } }, border: thinBottom };
    ws["C5"].s = { font: { name: "Calibri", sz: 16, color: { rgb: "000000" } }, alignment: { horizontal: "left" } };
    ws["D5"].s = { font: { name: "Calibri", sz: 16, color: { rgb: "000000" } }, alignment: { horizontal: "right", vertical: "center" } };
    ws["E5"].s = { font: { name: "Calibri", sz: 16 }, alignment: { horizontal: "center" } };
    ws["F5"].s = { font: { name: "Calibri", sz: 12 }, alignment: { horizontal: "center", vertical: "center" } };
    ws["G5"].s = { font: { name: "Calibri", sz: 14, bold: true, color: { rgb: "000000" } }, alignment: { horizontal: "center", vertical: "center" } };

    // рядки даних
    for (let r = firstDataRow; r <= lastDataRow; r++) {
      const cA = ws[`A${r}`], cB = ws[`B${r}`], cC = ws[`C${r}`], cD = ws[`D${r}`], cE = ws[`E${r}`], cF = ws[`F${r}`], cG = ws[`G${r}`];
      if (cA) cA.s = { font: { name: "Calibri", sz: 16, color: { rgb: COL_GRAY } }, alignment: { horizontal: "center", vertical: "center" } };
      if (cB) { cB.s = { font: { name: "Calibri", sz: 16 }, alignment: { horizontal: "center", vertical: "center" }, border: thinBottom }; if (cB.v) cB.z = FMT_DATE; }
      if (cC) cC.s = { font: { name: "Calibri", sz: 16 }, alignment: { horizontal: "left", vertical: "center" } };
      if (cD) { cD.s = { font: { name: "Calibri", sz: 16 }, alignment: { horizontal: "right", vertical: "center" } }; if (cD.v !== undefined) cD.z = FMT_USD; }
      if (cE) { cE.s = { font: { name: "Calibri", sz: 16 }, alignment: { horizontal: "center", vertical: "center" } }; if (cE.v !== undefined) cE.z = FMT_EUR; }
      if (cF) cF.s = { font: { name: "Calibri", sz: 12 }, alignment: { horizontal: "center", vertical: "center" } };
      if (cG) { cG.s = { font: { name: "Calibri", sz: 14, bold: true }, alignment: { horizontal: "center", vertical: "center" } }; if (cG.v !== undefined) cG.z = FMT_UAH; }
    }

    // об'єднання клітинок — як в оригіналі
    ws["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 1, c: 7 } },  // A1:H2 — заголовок
      { s: { r: 2, c: 1 }, e: { r: 2, c: 3 } },  // B3:D3 — сума $
      { s: { r: 2, c: 4 }, e: { r: 2, c: 5 } },  // E3:F3 — сума €
    ];

    ws["!cols"] = [
      { wch: 9 }, { wch: 17 }, { wch: 34 }, { wch: 15.6 }, { wch: 11 }, { wch: 12.4 }, { wch: 18 }, { wch: 18 }, { wch: 17 }, { wch: 10.4 },
    ];
    ws["!rows"] = [
      { hpt: 34.5 }, { hpt: 33 }, { hpt: 39 }, { hpt: 7.5 },
      ...Array(lastDataRow - 4).fill({ hpt: 21 }),
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Заощадження");
    return wb;
  }

  function exportXlsx() {
    const wb = buildWorkbook(entries);
    const stamp = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `oshchadna-knyzhka-${stamp}.xlsx`);
  }

  function triggerXlsxImport() {
    xlsxInputRef.current?.click();
  }

  function parseDateCell(v) {
    if (!v && v !== 0) return null;
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return null;
      return v.toISOString().slice(0, 10);
    }
    const s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    const dm = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
    if (dm) {
      const [, d, m, y] = dm;
      const mm = Number(m), dd = Number(d);
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
        return `${y}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
      }
      return null; // некоректна дата (напр. місяць 15) — лишаємо без дати, буде позначено прапорцем
    }
    return null;
  }

  // нормалізує текст заголовка для пошуку колонки (нижній регістр, без пробілів/крапок)
  function normHeader(v) {
    return (v === null || v === undefined) ? "" : String(v).toLowerCase().replace(/[.\s]/g, "");
  }

  function findCol(headerRow, matchers) {
    for (let i = 0; i < headerRow.length; i++) {
      const h = normHeader(headerRow[i]);
      if (!h) continue;
      if (matchers.some((m) => h.includes(m))) return i;
    }
    return -1;
  }

  function handleXlsxImportFile(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = new Uint8Array(reader.result);
        const wb = XLSX.read(data, { type: "array", cellDates: true });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        // читаємо як масив масивів, щоб самим знайти рядок заголовків
        // (заголовки не завжди в першому рядку — вище можуть бути назва, підсумки тощо)
        const rows2d = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });

        let headerIdx = -1, cols = null;
        for (let r = 0; r < Math.min(rows2d.length, 30); r++) {
          const row = rows2d[r] || [];
          const dateCol = findCol(row, ["дата", "date"]);
          const descCol = findCol(row, ["опис", "desc", "коментар", "призначення"]);
          if (dateCol !== -1 && descCol !== -1) {
            headerIdx = r;
            cols = {
              date: dateCol,
              desc: descCol,
              usd: findCol(row, ["usd", "дохід$", "дохід $", "$", "дохід"]),
              eur: findCol(row, ["eur", "€"]),
              rate: findCol(row, ["курс"]),
              uah: findCol(row, ["грнеквівалент", "грн", "uah", "₴"]),
            };
            break;
          }
        }

        if (headerIdx === -1) {
          throw new Error("Не вдалося знайти рядок заголовків (мають бути колонки «Дата» і «Опис»)");
        }

        const parsed = [];
        for (let r = headerIdx + 1; r < rows2d.length; r++) {
          const row = rows2d[r] || [];
          const dateRaw = cols.date !== -1 ? row[cols.date] : null;
          const desc = cols.desc !== -1 ? row[cols.desc] : null;
          const usdRaw = cols.usd !== -1 ? row[cols.usd] : null;
          const eurRaw = cols.eur !== -1 ? row[cols.eur] : null;
          const rateRaw = cols.rate !== -1 ? row[cols.rate] : null;
          const uahRaw = cols.uah !== -1 ? row[cols.uah] : null;

          const isEmpty = (v) => v === null || v === undefined || v === "";
          if (isEmpty(dateRaw) && isEmpty(desc) && isEmpty(usdRaw) && isEmpty(eurRaw)) continue; // порожній рядок

          const usd = !isEmpty(usdRaw) && !isNaN(Number(usdRaw)) ? Number(usdRaw) : null;
          const eur = !isEmpty(eurRaw) && !isNaN(Number(eurRaw)) ? Number(eurRaw) : null;
          const rate = !isEmpty(rateRaw) && !isNaN(Number(rateRaw)) ? Number(rateRaw) : null;
          const uah = !isEmpty(uahRaw) && !isNaN(Number(uahRaw)) ? Number(uahRaw) : null;
          const date = parseDateCell(dateRaw);

          parsed.push({
            id: uid(),
            date,
            desc: !isEmpty(desc) ? String(desc).trim() : "Без опису",
            usd, eur, rate, uah,
            flag: date ? null : `Дата не розпізнана або некоректна: "${dateRaw ?? ""}"`,
          });
        }

        if (parsed.length === 0) {
          throw new Error("У файлі не знайдено жодного запису після рядка заголовків");
        }

        const replace = confirm(
          `Знайдено ${parsed.length} записів у Excel-файлі.\n\nOK — замінити всі поточні записи цими.\nСкасувати — додати їх до існуючих (без заміни).`
        );
        if (replace) {
          setEntries(parsed);
        } else {
          setEntries((prev) => [...parsed, ...prev]);
        }
        setImportMsg({ ok: true, text: `Імпортовано ${parsed.length} записів з Excel.` });
      } catch (e) {
        setImportMsg({ ok: false, text: "Не вдалося прочитати Excel-файл: " + e.message });
      } finally {
        ev.target.value = "";
        setTimeout(() => setImportMsg(null), 4000);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {
      console.error("Storage error:", e);
    }
  }, [entries]);

  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [searchQuery, setSearchQuery] = useState("");

  const filteredEntries = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return entries.filter((e) => {
      if (q && !(e.desc || "").toLowerCase().includes(q)) return false;
      if (dateFrom || dateTo) {
        if (!e.date) return false;
        if (dateFrom && e.date < dateFrom) return false;
        if (dateTo && e.date > dateTo) return false;
      }
      return true;
    });
  }, [entries, dateFrom, dateTo, searchQuery]);

  const visible = useMemo(() => {
    return [...filteredEntries].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }, [filteredEntries]);

  // ---- вибір кількох записів зі списку ----
  // одинарний клік по галочці — додає/знімає один запис, не чіпаючи решту.
  // довге натискання на галочці — вибирає діапазон від попереднього "якірного" запису до цього.
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const anchorIndexRef = useRef(null);

  function toggleSelect(id) {
    const idx = visible.findIndex((e) => e.id === id);
    if (idx !== -1) anchorIndexRef.current = idx;
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  function selectRangeTo(id) {
    const idx = visible.findIndex((e) => e.id === id);
    if (idx === -1) return;
    const anchor = anchorIndexRef.current !== null ? anchorIndexRef.current : idx;
    const from = Math.min(anchor, idx), to = Math.max(anchor, idx);
    setSelectedIds((prev) => {
      const next = new Set(prev);
      for (let i = from; i <= to; i++) next.add(visible[i].id);
      return next;
    });
    anchorIndexRef.current = idx;
  }

  function clearSelection() {
    setSelectedIds(new Set());
    anchorIndexRef.current = null;
  }

  // якщо є вибір — шапка й графік рахуються тільки по вибраних записах,
  // інакше — по записах у межах вибраного періоду. Сам список (visible) завжди
  // показує всі записи в межах періоду, вибір на нього не впливає.
  const effectiveEntries = useMemo(() => {
    if (selectedIds.size > 0) return entries.filter((e) => selectedIds.has(e.id));
    return filteredEntries;
  }, [entries, selectedIds, filteredEntries]);

  const totals = useMemo(() => {
    let usd = 0, eur = 0, uah = 0, flagged = 0;
    let buyUsd = 0, buyEur = 0, cashUsd = 0, cashEur = 0;
    let expenseUsd = 0, expenseEur = 0;
    effectiveEntries.forEach((e) => {
      if (e.usd) usd += e.usd;
      if (e.eur) eur += e.eur;
      const eq = uahEquivalent(e);
      if (eq) uah += eq;
      if (e.flag) flagged++;
      if (eq !== null) {
        if (e.usd) buyUsd += e.usd;
        if (e.eur) buyEur += e.eur;
      } else {
        if (e.usd && e.usd > 0) cashUsd += e.usd;
        if (e.eur && e.eur > 0) cashEur += e.eur;
      }
      if (e.usd && e.usd < 0) expenseUsd += e.usd;
      if (e.eur && e.eur < 0) expenseEur += e.eur;
    });
    const buyTotal = buyUsd + buyEur;
    const avgRate = buyTotal > 0 ? uah / buyTotal : null;
    return { usd, eur, uah, combined: usd + eur, flagged, buyUsd, buyEur, cashUsd, cashEur, expenseUsd, expenseEur, avgRate };
  }, [effectiveEntries]);

  const chartData = useMemo(() => {
    const valid = effectiveEntries.filter((e) => e.date).sort((a, b) => a.date.localeCompare(b.date));
    let running = 0;
    return valid.map((e) => {
      running += (e.usd || 0) + (e.eur || 0);
      return { date: e.date, value: Math.round(running * 100) / 100 };
    });
  }, [effectiveEntries]);

  // унікальні описи серед усіх записів — для автопідказок у полі "Опис"
  const descOptions = useMemo(() => {
    const set = new Set();
    entries.forEach((e) => { if (e.desc) set.add(e.desc); });
    return Array.from(set);
  }, [entries]);

  function openAdd() {
    setEditing({ id: null, date: todayISO(), desc: "", usd: "", eur: "", rate: "", uah: "" });
    setFormOpen(true);
  }
  function openEdit(entry) {
    setEditing({ ...entry, usd: entry.usd ?? "", eur: entry.eur ?? "", rate: entry.rate ?? "", uah: entry.uah ?? "" });
    setFormOpen(true);
  }
  function remove(id) {
    if (!confirm("Видалити цей запис?")) return;
    setEntries((prev) => prev.filter((e) => e.id !== id));
  }
  function save(form) {
    const usd = form.usd === "" ? null : Number(form.usd);
    const eur = form.eur === "" ? null : Number(form.eur);
    const rate = form.rate === "" ? null : Number(form.rate);
    let uah = form.uah === "" ? null : Number(form.uah);
    if (uah === null && rate !== null) {
      const amt = usd ?? eur;
      if (amt !== null) uah = Math.round(amt * rate * 100) / 100;
    }
    const clean = {
      id: form.id ?? uid(),
      date: form.date || null,
      desc: form.desc.trim() || "Без опису",
      usd, eur, rate, uah,
      flag: form.date ? null : "Дата не вказана",
    };
    setEntries((prev) => {
      if (form.id) return prev.map((e) => (e.id === form.id ? clean : e));
      return [clean, ...prev];
    });
    if (!form.id) {
      // нова (не редагована) сума за замовчуванням додається до "ТУТ"
      if (usd) setHereUsd((h) => Math.round((h + usd) * 100) / 100);
      if (eur) setHereEur((h) => Math.round((h + eur) * 100) / 100);
    }
    setFormOpen(false);
    setEditing(null);
  }

  return (
    <div style={{ minHeight: "100vh" }}>
      {/* ---- Обкладинка / шапка ---- */}
      <div style={{ background: "#1F4B3F", color: "#F1EDE1" }}>
        <div style={{ maxWidth: 880, margin: "0 auto", padding: "28px 20px 22px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <PiggyIcon size={26} />
            <h1 style={{ fontFamily: "'Special Elite', monospace", fontSize: 28, margin: 0, fontWeight: 400 }}>
              Мої заощадження
            </h1>
          </div>

          <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "1fr", gap: 12 }}>
            <SummaryCard label="Сума $ + €" value={fmt(totals.combined)} labelSize={12} valueSize={30} center />
          </div>

          <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
            <SummaryCard label="Сума, $" value={"$" + fmt(totals.usd)} color="#8fd6ab" />
            <SummaryCard label="Сума, €" value={"€" + fmt(totals.eur)} color="#9fc7e8" />
          </div>

          <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
            <SummaryCard
              label="Купівля"
              value={<><div>{"$" + fmt(totals.buyUsd)}</div><div>{"€" + fmt(totals.buyEur)}</div></>}
              color="#e3cd8c"
            />
            <SummaryCard
              label="Готівка"
              value={<><div>{"$" + fmt(totals.cashUsd)}</div><div>{"€" + fmt(totals.cashEur)}</div></>}
              color="#b9b198"
            />
            <SummaryCard
              label="Витрати"
              value={<><div>{"-$" + fmt(Math.abs(totals.expenseUsd))}</div><div>{"-€" + fmt(Math.abs(totals.expenseEur))}</div></>}
              color="#e8a3a3"
            />
            <SummaryCard label="Переведені грн в $" value={fmt(Math.round(totals.uah)) + " ₴"} color="#e3cd8c" />
          </div>

          <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
            <EditableSummaryCard
              label="ТУТ"
              usd={hereUsd}
              eur={hereEur}
              onChangeUsd={(v) => setHereUsd(v)}
              onChangeEur={(v) => setHereEur(v)}
            />
            <SummaryCard
              label="ТАМ"
              value={<><div>{"$" + fmt(totals.usd - hereUsd)}</div><div>{"€" + fmt(totals.eur - hereEur)}</div></>}
              color="#9fc7e8"
            />
          </div>

          <button
            onClick={openAdd}
            style={{
              marginTop: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              background: "#F1EDE1", color: "#1F4B3F", border: "none", borderRadius: 8,
              padding: "10px 14px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, width: "100%",
            }}
          >
            <PlusIcon size={16} /> Новий запис
          </button>
        </div>
      </div>

      {totals.flagged > 0 && (
        <div style={{ maxWidth: 880, margin: "14px auto 0", padding: "0 20px" }}>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "#fbf0d9", border: "1px solid #e3cd8c", borderRadius: 8, padding: "10px 12px", fontSize: 13, color: "#6b5417" }}>
            <WarnIcon size={16} style={{ flexShrink: 0, marginTop: 2 }} />
            <span>{totals.flagged} {totals.flagged === 1 ? "запис має" : "записи мають"} позначку для перевірки (некоректна або відсутня дата). Відкрийте запис і виправте дату.</span>
          </div>
        </div>
      )}

      {/* ---- Діапазон дат ---- */}
      <div style={{ maxWidth: 880, margin: "18px auto 0", padding: "0 20px", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <span className="mono" style={{ fontSize: 11, color: "#5a5237", textTransform: "uppercase", letterSpacing: "0.05em" }}>Період:</span>
        <input
          type="date"
          value={dateFrom}
          onChange={(e) => setDateFrom(e.target.value)}
          style={{ width: "auto" }}
        />
        <span className="mono" style={{ fontSize: 12, color: "#8a8267" }}>—</span>
        <input
          type="date"
          value={dateTo}
          onChange={(e) => setDateTo(e.target.value)}
          style={{ width: "auto" }}
        />
        {(dateFrom || dateTo) && (
          <button
            onClick={() => { setDateFrom(""); setDateTo(""); }}
            style={{ background: "none", border: "none", color: "#8a8267", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textDecoration: "underline" }}
          >
            весь період
          </button>
        )}
      </div>

      {/* ---- Графік ---- */}
      <div style={{ maxWidth: 880, margin: "10px auto 0", padding: "0 20px" }}>
        <div style={{ background: "#fbf9f2", border: "1px solid #c9c2a8", borderRadius: 10, padding: "12px 8px 8px" }}>
          <MiniLineChart data={chartData} />
        </div>
      </div>

      {/* ---- Панель дій ---- */}
      <div style={{ maxWidth: 880, margin: "18px auto 0", padding: "0 20px", display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <IconBtn onClick={exportXlsx} title="Зберегти у файл Excel (.xlsx)" size={36}>
          <SaveIcon size={16} />
        </IconBtn>

        <IconBtn onClick={triggerXlsxImport} title="Завантажити записи з файлу Excel (.xlsx)" size={36}>
          <UploadIcon size={16} />
        </IconBtn>
        <input ref={xlsxInputRef} type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onChange={handleXlsxImportFile} style={{ display: "none" }} />

        {fsaSupported && (
          <button
            onClick={
              fileHandle ? forceSaveNow :
              pendingHandle ? reconnectExcelFile :
              connectExcelFile
            }
            title={
              fileHandle ? `Автозбереження увімкнено (${fileHandle.name || "файл"}). Клік — зберегти зараз.` :
              pendingHandle ? "Автозбереження призупинено — клік, щоб відновити." :
              "Клік — обрати Excel-файл і увімкнути автозбереження"
            }
            style={{
              display: "flex", alignItems: "center", gap: 6, height: 36,
              background: fileHandle ? "#e7efe9" : pendingHandle ? "#fbf0d9" : "#f6e8e6",
              color: fileHandle ? "#25543f" : pendingHandle ? "#6b5417" : "#8a2f2f",
              border: `1px solid ${fileHandle ? "#3E6B52" : pendingHandle ? "#e3cd8c" : "#B5474D"}`,
              borderRadius: 8, padding: "0 12px",
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 12,
            }}
          >
            <SyncIcon size={14} className={autoSaveState === "saving" ? "spin" : ""} />
            Автозбереження
          </button>
        )}
      </div>

      {fsaSupported && (fileHandle || pendingHandle) && (
        <div style={{ maxWidth: 880, margin: "6px auto 0", padding: "0 20px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <span className="mono" style={{ fontSize: 11, color: autoSaveState === "error" ? "#B5474D" : "#8a8267" }}>
            {autoSaveState === "saving" && "Збереження у файл…"}
            {autoSaveState === "error" && "Не вдалося зберегти у файл."}
            {autoSaveState === "saved" && lastSavedAt && `Збережено у файл: ${fmtDateTime(lastSavedAt)}`}
            {autoSaveState === "idle" && pendingHandle && "Автозбереження призупинено — клік на кнопку, щоб відновити."}
          </span>
          {fileHandle && (
            <button
              onClick={disconnectExcelFile}
              style={{ background: "none", border: "none", color: "#8a8267", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textDecoration: "underline" }}
            >
              відключити
            </button>
          )}
        </div>
      )}

      {importMsg && (
        <div style={{ maxWidth: 880, margin: "10px auto 0", padding: "0 20px" }}>
          <div style={{
            background: importMsg.ok ? "#e7efe9" : "#f6e8e6",
            border: `1px solid ${importMsg.ok ? "#3E6B52" : "#B5474D"}`,
            color: importMsg.ok ? "#25543f" : "#6b1f1f",
            borderRadius: 8, padding: "8px 12px", fontSize: 13,
          }}>
            {importMsg.text}
          </div>
        </div>
      )}

      {/* ---- Реєстр записів ---- */}
      <div style={{ maxWidth: 880, margin: "18px auto 60px", padding: "0 20px" }}>
        {searchQuery.trim() && (
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <span className="mono" style={{ fontSize: 12, color: "#3E6B52" }}>
              Знайдено записів: {visible.length} — шапка й графік показують суми лише по них
            </span>
            <button
              onClick={() => setSearchQuery("")}
              style={{ background: "none", border: "none", color: "#8a8267", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textDecoration: "underline" }}
            >
              скасувати пошук
            </button>
          </div>
        )}
        {selectedIds.size > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <span className="mono" style={{ fontSize: 12, color: "#3E6B52" }}>
              Вибрано записів: {selectedIds.size} — шапка й графік показують суми лише по них
            </span>
            <button
              onClick={clearSelection}
              style={{ background: "none", border: "none", color: "#8a8267", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textDecoration: "underline" }}
            >
              скасувати вибір
            </button>
          </div>
        )}
        <div style={{ border: "1px solid #c9c2a8", borderRadius: 10, overflow: "hidden" }}>
          <input
            type="text"
            value={searchQuery}
            onChange={(ev) => setSearchQuery(ev.target.value)}
            placeholder="Пошук за назвою"
            style={{
              width: "100%", border: "none", borderBottom: "1px solid #c9c2a8",
              borderRadius: 0, background: "#f4f0e2", fontSize: 13, padding: "10px 14px",
            }}
          />
          <div style={{ background: "#fbf9f2" }}>
            {visible.length === 0 && (
              <div style={{ padding: 24, textAlign: "center", color: "#8a8267", fontSize: 14 }}>
                Записів ще немає.
              </div>
            )}
            {visible.map((e) => (
              <LedgerRow key={e.id} e={e} onEdit={openEdit} onRemove={remove} selected={selectedIds.has(e.id)} onToggleSelect={toggleSelect} onRangeSelect={selectRangeTo} />
            ))}
          </div>
        </div>
      </div>

      {formOpen && (
        <EntryForm initial={editing} onCancel={() => { setFormOpen(false); setEditing(null); }} onSave={save} descOptions={descOptions} />
      )}

      <div style={{ textAlign: "center", padding: "0 20px 30px", fontSize: 11, color: "#8a8267", fontFamily: "'IBM Plex Mono', monospace" }}>
        Дані зберігаються локально у цьому браузері. Щоб перенести їх на інший пристрій чи зробити резервну копію — натисни «Експорт», а на іншому пристрої відкрий цей файл і натисни «Імпорт».
      </div>
    </div>
  );
}

function LedgerRow({ e, onEdit, onRemove, selected, onToggleSelect, onRangeSelect }) {
  const eq = uahEquivalent(e);
  const pressTimer = useRef(null);
  const longPressFired = useRef(false);

  function startPress() {
    longPressFired.current = false;
    pressTimer.current = setTimeout(() => {
      longPressFired.current = true;
      onRangeSelect(e.id);
    }, 500);
  }
  function cancelPress() {
    if (pressTimer.current) { clearTimeout(pressTimer.current); pressTimer.current = null; }
  }
  function handleCheckboxClick(ev) {
    ev.preventDefault(); // самі керуємо перемиканням, щоб відрізнити клік від довгого натискання
    if (longPressFired.current) {
      longPressFired.current = false;
      return; // діапазон вже вибрано довгим натисканням — звичайний клік ігноруємо
    }
    onToggleSelect(e.id);
  }

  return (
    <div className="ledger-row" style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", flexWrap: "wrap", background: selected ? "#eef3ea" : undefined }}>
      <input
        type="checkbox"
        checked={selected}
        readOnly
        onClick={handleCheckboxClick}
        onPointerDown={startPress}
        onPointerUp={cancelPress}
        onPointerLeave={cancelPress}
        onPointerCancel={cancelPress}
        title="Клік — вибрати/зняти. Утримати — вибрати діапазон від попереднього вибраного запису."
        style={{ width: 16, height: 16, flexShrink: 0, accentColor: "#1F4B3F" }}
      />
      <div className="mono" style={{ width: 76, fontSize: 12, color: "#5a5237", flexShrink: 0 }}>
        {e.flag ? (
          <span title={e.flag} style={{ color: "#B5474D", display: "flex", alignItems: "center", gap: 4 }}>
            <WarnIcon size={12} /> дата?
          </span>
        ) : fmtDate(e.date)}
      </div>
      <div style={{ flex: "1 1 160px", minWidth: 140 }}>
        <div style={{ fontSize: 14, color: "#1b2a4a" }}>{e.desc}</div>
      </div>
      <div className="mono" style={{ textAlign: "right", fontSize: 13, color: "#1b2a4a", minWidth: 90 }}>
        {eq !== null ? fmt(eq) + " ₴" : ""}
        {e.rate ? <div style={{ fontSize: 10, fontWeight: 400, color: "#8a8267" }}>курс {fmt(e.rate)}</div> : null}
      </div>
      <div className="mono" style={{ textAlign: "right", fontSize: 16, fontWeight: 700, minWidth: 100, color: e.usd < 0 || e.eur < 0 ? "#B5474D" : "#3a3a3a" }}>
        {!e.usd && !e.eur
          ? "—"
          : <>
              {e.usd ? `${e.usd < 0 ? "-" : "+"}$${fmt(Math.abs(e.usd))}` : ""}
              {e.usd && e.eur ? " " : ""}
              {e.eur ? `${e.eur < 0 ? "-" : "+"}€${fmt(Math.abs(e.eur))}` : ""}
            </>
        }
      </div>
      <div style={{ display: "flex", gap: 4, marginLeft: "auto" }}>
        <IconBtn onClick={() => onEdit(e)}><PencilIcon size={14} /></IconBtn>
        <IconBtn onClick={() => onRemove(e.id)}><TrashIcon size={14} /></IconBtn>
      </div>
    </div>
  );
}

function SummaryCard({ label, value, color, labelSize, valueSize, center }) {
  return (
    <div style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, padding: "10px 12px", textAlign: center ? "center" : "left" }}>
      <div className="mono" style={{ fontSize: labelSize || 10, textTransform: "uppercase", letterSpacing: "0.08em", opacity: 0.7 }}>{label}</div>
      <div className="mono" style={{ fontSize: valueSize || 17, fontWeight: 600, marginTop: 2, color: color || "#F1EDE1" }}>{value}</div>
    </div>
  );
}

function EditableSummaryCard({ label, usd, eur, onChangeUsd, onChangeEur }) {
  return (
    <div style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, padding: "10px 12px" }}>
      <div className="mono" style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.08em", opacity: 0.7 }}>{label}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 2 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span className="mono" style={{ fontSize: 17, fontWeight: 600, color: "#8fd6ab" }}>$</span>
          <input
            type="number"
            value={usd}
            onChange={(ev) => onChangeUsd(ev.target.value === "" ? 0 : Number(ev.target.value))}
            className="mono"
            style={{
              background: "transparent", border: "none", borderBottom: "1px solid rgba(255,255,255,0.3)",
              color: "#F1EDE1", fontSize: 17, fontWeight: 600, padding: "0 0 1px 0", width: "100%",
            }}
          />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span className="mono" style={{ fontSize: 17, fontWeight: 600, color: "#9fc7e8" }}>€</span>
          <input
            type="number"
            value={eur}
            onChange={(ev) => onChangeEur(ev.target.value === "" ? 0 : Number(ev.target.value))}
            className="mono"
            style={{
              background: "transparent", border: "none", borderBottom: "1px solid rgba(255,255,255,0.3)",
              color: "#F1EDE1", fontSize: 17, fontWeight: 600, padding: "0 0 1px 0", width: "100%",
            }}
          />
        </div>
      </div>
    </div>
  );
}

function IconBtn({ onClick, children, size, title }) {
  const s = size || 30;
  return (
    <button
      onClick={onClick}
      title={title}
      style={{ background: "#fbf9f2", border: "1px solid #c9c2a8", borderRadius: 8, width: s, height: s, display: "flex", alignItems: "center", justifyContent: "center", color: "#5a5237", flexShrink: 0 }}
    >
      {children}
    </button>
  );
}

function EntryForm({ initial, onCancel, onSave, descOptions }) {
  const [form, setForm] = useState(initial);
  const [showSug, setShowSug] = useState(false);
  const set = (k) => (ev) => setForm((f) => ({ ...f, [k]: ev.target.value }));

  const suggestions = useMemo(() => {
    const q = (form.desc || "").trim().toLowerCase();
    if (q.length < 2) return [];
    return (descOptions || [])
      .filter((d) => d.toLowerCase() !== q && d.toLowerCase().includes(q))
      .slice(0, 6);
  }, [form.desc, descOptions]);

  function pickSuggestion(s) {
    setForm((f) => ({ ...f, desc: s }));
    setShowSug(false);
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(27,42,74,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }}
      onClick={onCancel}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: "#fbf9f2", width: "100%", maxWidth: 480, borderRadius: "14px 14px 0 0", padding: 20, maxHeight: "90vh", overflowY: "auto" }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h2 style={{ margin: 0, fontFamily: "'Special Elite', monospace", fontSize: 18, color: "#1b2a4a" }}>
            {form.id ? "Редагувати запис" : "Новий запис"}
          </h2>
          <button onClick={onCancel} style={{ background: "none", border: "none", color: "#5a5237" }}><XIcon size={20} /></button>
        </div>

        <div style={{ display: "grid", gap: 10 }}>
          <Field label="Дата">
            <input type="date" value={form.date || ""} onChange={set("date")} />
          </Field>
          <Field label="Опис">
            <div style={{ position: "relative" }}>
              <input
                type="text"
                value={form.desc}
                onChange={set("desc")}
                onFocus={() => setShowSug(true)}
                onBlur={() => setTimeout(() => setShowSug(false), 150)}
                autoComplete="off"
              />
              {showSug && suggestions.length > 0 && (
                <div style={{
                  position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 60,
                  background: "#fbf9f2", border: "1px solid #c9c2a8", borderRadius: 8,
                  boxShadow: "0 4px 10px rgba(27,42,74,0.15)", overflow: "hidden",
                }}>
                  {suggestions.map((s) => (
                    <div
                      key={s}
                      onMouseDown={() => pickSuggestion(s)}
                      style={{ padding: "8px 10px", fontSize: 14, color: "#1b2a4a", cursor: "pointer", borderBottom: "1px solid #eee6d6" }}
                    >
                      {s}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Field label="$ (USD)">
              <AmountField value={form.usd} onChange={(v) => setForm((f) => ({ ...f, usd: v }))} />
            </Field>
            <Field label="€ (EUR)">
              <AmountField value={form.eur} onChange={(v) => setForm((f) => ({ ...f, eur: v }))} />
            </Field>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Field label="Курс купівлі"><input type="number" step="0.01" value={form.rate} onChange={set("rate")} /></Field>
            <Field label="Еквівалент, ₴"><input type="number" value={form.uah} onChange={set("uah")} /></Field>
          </div>
        </div>

        <button
          onClick={() => onSave(form)}
          disabled={!form.desc && !form.date}
          style={{ marginTop: 16, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: "#1F4B3F", color: "#F1EDE1", border: "none", borderRadius: 8, padding: "12px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 14 }}
        >
          <CheckIcon size={16} /> Зберегти
        </button>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block" }}>
      <div className="mono" style={{ fontSize: 11, color: "#5a5237", marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</div>
      {children}
    </label>
  );
}

// --- поле суми з розділенням тисяч прямо під час введення ---
function isSignificantChar(ch) {
  return /[0-9\-.,]/.test(ch);
}
function cleanAmount(s) {
  let str = (s || "").replace(/[\s\u00A0]/g, "");
  const neg = str.startsWith("-");
  str = str.replace(/-/g, "").replace(",", ".").replace(/[^\d.]/g, "");
  const parts = str.split(".");
  if (parts.length > 2) str = parts[0] + "." + parts.slice(1).join("");
  return (neg ? "-" : "") + str;
}
function formatAmount(raw) {
  if (raw === "" || raw === null || raw === undefined) return "";
  if (raw === "-") return "-";
  const endsWithDot = raw.endsWith(".");
  const num = Number(raw);
  if (isNaN(num)) return raw;
  let formatted = new Intl.NumberFormat("uk-UA", { maximumFractionDigits: 2 }).format(num);
  if (endsWithDot) formatted += ",";
  return formatted;
}
function countSignificant(s) {
  let n = 0;
  for (const ch of s) if (isSignificantChar(ch)) n++;
  return n;
}
function posForSignificant(s, target) {
  if (target <= 0) return 0;
  let n = 0;
  for (let i = 0; i < s.length; i++) {
    if (isSignificantChar(s[i])) {
      n++;
      if (n === target) return i + 1;
    }
  }
  return s.length;
}
function AmountField({ value, onChange }) {
  const ref = useRef(null);
  function handleChange(ev) {
    const input = ev.target;
    const rawInput = input.value;
    const cursorPos = input.selectionStart ?? rawInput.length;
    const sigBefore = countSignificant(rawInput.slice(0, cursorPos));
    const cleaned = cleanAmount(rawInput);
    onChange(cleaned);
    requestAnimationFrame(() => {
      if (!ref.current) return;
      const formatted = formatAmount(cleaned);
      const pos = posForSignificant(formatted, sigBefore);
      try { ref.current.setSelectionRange(pos, pos); } catch (e) {}
    });
  }
  return (
    <input
      ref={ref}
      type="text"
      inputMode="decimal"
      value={formatAmount(value)}
      onChange={handleChange}
    />
  );
}
